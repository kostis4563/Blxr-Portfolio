name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: blxr-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, blxr-deploy]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - run: npm ci
      - run: sudo bash "$GITHUB_WORKSPACE/deploy/deploy.sh"
      - run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
        if: always()
