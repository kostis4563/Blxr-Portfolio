name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: blxr-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, blxr-deploy]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - run: npm ci

      - name: Stage server secrets
        env:
          GITHUB_TOKEN_VALUE: ${{ secrets.BLXR_GITHUB_TOKEN }}
          DISCORD_CLIENT_ID_VALUE: ${{ secrets.BLXR_DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET_VALUE: ${{ secrets.BLXR_DISCORD_CLIENT_SECRET }}
        run: |
          printf 'GITHUB_TOKEN=%s\n' "$GITHUB_TOKEN_VALUE" > "$GITHUB_WORKSPACE/deploy/.env-overrides"
          printf 'DISCORD_CLIENT_ID=%s\n' "$DISCORD_CLIENT_ID_VALUE" >> "$GITHUB_WORKSPACE/deploy/.env-overrides"
          printf 'DISCORD_CLIENT_SECRET=%s\n' "$DISCORD_CLIENT_SECRET_VALUE" >> "$GITHUB_WORKSPACE/deploy/.env-overrides"

      - run: sudo bash "$GITHUB_WORKSPACE/deploy/deploy.sh"
