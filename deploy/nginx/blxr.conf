server {
    listen 80;
    listen [::]:80;

    server_name blxr.net www.blxr.net;

    location /.well-known/acme-challenge/ {
        root /var/www/blxr;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name blxr.net www.blxr.net;

    ssl_certificate     /etc/letsencrypt/live/blxr.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blxr.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/blxr;
    index index.html;

    include /etc/nginx/snippets/blxr-cloudflare-realip.conf;

    include /etc/nginx/snippets/blxr-security-headers.conf;

    brotli_static on;
    brotli off;
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        text/css
        text/plain
        text/xml
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml;

    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/blxr-security-headers.conf;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/blxr-security-headers.conf;
    }

    location ~* \.(png|jpe?g|gif|webp|avif|svg|ico|mp3|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/blxr-security-headers.conf;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/blxr-security-headers.conf;
        include /etc/nginx/snippets/blxr-early-hints.conf;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8899;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location ~ "^/([a-z]{2})/$" {
        return 301 /$1;
    }
    location = /en {
        return 301 /;
    }
    location ~ "^/en(/.+)$" {
        return 301 $1;
    }

    location = /guide {
        try_files /guide.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/blxr-security-headers.conf;
    }

    location = /guide.html {
        return 301 /guide;
    }
    location = /guide/ {
        return 301 /guide;
    }

    location ^~ /guide/ {
        rewrite ^(/guide/.+)\.html$ $1 permanent;
        try_files $uri $uri.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/blxr-security-headers.conf;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
