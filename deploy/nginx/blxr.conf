limit_req_zone $binary_remote_addr zone=blxr_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=blxr_conn:10m;

server {
    listen 80;
    listen [::]:80;

    server_name blxr.net www.blxr.net;

    location /.well-known/acme-challenge/ {
        root /var/www/blxr;
    }

    location / {
        return 301 https://blxr.net$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name www.blxr.net;

    ssl_certificate     /etc/letsencrypt/live/blxr.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blxr.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://blxr.net$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name blxr.net;

    ssl_certificate     /etc/letsencrypt/live/blxr.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blxr.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/blxr;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    include /etc/nginx/snippets/blxr-cloudflare-realip.conf;

    include /etc/nginx/snippets/blxr-security-headers.conf;

    brotli_static on;
    brotli off;
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        text/css
        text/plain
        text/xml
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml;

    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/blxr-security-headers.conf;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/blxr-security-headers.conf;
    }

    location ~* \.(png|jpe?g|gif|webp|avif|svg|ico|mp3|mp4|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/blxr-security-headers.conf;
    }

    location ~* \.html$ {
        if ($request_uri ~ "^(.*/)index\.html(\?.*)?$") {
            return 301 $1$2;
        }
        if ($request_uri ~ "^(.+)\.html(\?.*)?$") {
            return 301 $1$2;
        }

        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/blxr-security-headers.conf;
        include /etc/nginx/snippets/blxr-early-hints.conf;
    }

    location ~ "/\.(?!well-known/)" {
        return 404;
    }
    location ~* "\.(env|map|bak|orig|sql|sh|log|ya?ml|toml|ini)$" {
        return 404;
    }

    location /api/ {
        limit_req zone=blxr_api burst=40 nodelay;
        limit_req_status 429;
        limit_conn blxr_conn 20;
        limit_conn_status 429;
        client_max_body_size 64k;

        proxy_pass http://127.0.0.1:8899;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 10s;
        proxy_hide_header X-Powered-By;
    }

    location ~ "^(?!/api/)(/.+)/$" {
        return 301 $1$is_args$args;
    }
    location ~ "^/(en|es|fr|de|it|pt|nl|el|no|sv|da|fi|pl|cs|hu|ro|bg|sr|uk|ru|tr|ja|ko|zh|vi|th|id|hi|bn|ar|fa|he)$" {
        return 301 /;
    }
    location ~ "^/(en|es|fr|de|it|pt|nl|el|no|sv|da|fi|pl|cs|hu|ro|bg|sr|uk|ru|tr|ja|ko|zh|vi|th|id|hi|bn|ar|fa|he)(/.+)$" {
        return 301 $2$is_args$args;
    }

    location ~ "^/projects/([^/]+?)(\.html)?/?$" {
        return 301 /projects#$1;
    }

    location ~ "^/@[a-z0-9_]{3,20}/?$" {
        try_files /profile.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/blxr-security-headers.conf;
    }

    location ~ "^/u/([a-z0-9_]{3,20})/?$" {
        return 301 /@$1;
    }
    location = /u {
        return 301 /;
    }

    location = /guide {
        try_files /guide.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/blxr-security-headers.conf;
    }

    location = /guide.html {
        return 301 /guide;
    }
    location = /guide/ {
        return 301 /guide;
    }

    location ^~ /guide/ {
        rewrite ^(/guide/.+)\.html$ $1 permanent;
        try_files $uri $uri.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/blxr-security-headers.conf;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
