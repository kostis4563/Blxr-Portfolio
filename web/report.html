<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A WebScanner security report, decrypted in your browser." />
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" sizes="512x512" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#090909" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f1ee" />

    <title>Scan Report · blxr</title>

    <link rel="preload" href="/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (function () {
        try {
          var stored = null
          try { stored = localStorage.getItem('blxr-theme') } catch (e) {}
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : stored === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          try {
            var colors = localStorage.getItem('blxr-colors-css')
            if (colors) {
              var sheet = document.createElement('style')
              sheet.id = 'custom-colors'
              sheet.textContent = colors
              document.head.appendChild(sheet)
            }
          } catch (e) {}
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <div class="flex min-h-screen flex-col bg-bg text-ink">
        <header class="sticky top-0 z-40 border-b border-line bg-bg/85 backdrop-blur-md">
          <div class="mx-auto flex h-14 w-full max-w-[760px] items-center justify-between gap-4 px-6">
            <div class="flex min-w-0 items-center gap-2.5 text-[13.5px]">
              <a href="/" class="rounded font-semibold tracking-tight text-ink-strong">blxr</a>
              <span aria-hidden="true" class="text-ink-faint">/</span>
              <span class="truncate text-ink-muted">Security report</span>
            </div>
            <span aria-hidden="true" class="-mr-2 h-8 w-8"></span>
          </div>
        </header>
        <main aria-busy="true" class="flex min-w-0 flex-1 flex-col">
          <section class="mx-auto w-full max-w-[760px] px-6 pt-20 pb-24">
            <h1 class="text-[22px] font-semibold tracking-[-0.02em] text-ink-strong">Decrypting report<span aria-hidden="true" class="dots"><span>.</span><span>.</span><span>.</span></span></h1>
            <p class="mt-2 max-w-[54ch] text-[14px] leading-relaxed text-ink-muted">The report is being decrypted in your browser.</p>
            <noscript>
              <p class="mt-2 max-w-[54ch] text-[14px] leading-relaxed text-ink-subtle">This page needs JavaScript: the key never leaves your browser, so the report can only be opened here.</p>
            </noscript>
          </section>
        </main>
      </div>
    </div>
    <script type="module" src="/src/report-main.jsx"></script>
  </body>
</html>
